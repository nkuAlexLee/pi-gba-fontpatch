<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>gbajs2 Memory Viewer</title>
<style>
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: #1e1f24;
		color: #d4d4d4;
		font-family: 'Consolas', 'Courier New', monospace;
		font-size: 13px;
		display: flex;
		flex-direction: column;
		height: 100vh;
		overflow: hidden;
	}
	header {
		background: #2a2b31;
		border-bottom: 1px solid #3a3b42;
		padding: 6px 14px;
		display: flex;
		align-items: center;
		gap: 12px;
		flex-shrink: 0;
	}
	header h1 { font-size: 15px; margin: 0; color: #7ec699; font-weight: 600; }
	header .status { color: #999; }
	#main {
		flex: 1;
		display: flex;
		min-height: 0;
	}
	/* ---------- Left: game ---------- */
	#left {
		width: 50%;
		min-width: 420px;
		display: flex;
		flex-direction: column;
		border-right: 1px solid #3a3b42;
		background: #16171a;
	}
	#screenWrap {
		flex: 1;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 10px;
		min-height: 0;
	}
	#screen {
		width: 480px;
		height: 320px;
		image-rendering: pixelated;
		background: #000;
		border: 1px solid #3a3b42;
	}
	#gameControls {
		padding: 8px 10px;
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
		border-top: 1px solid #3a3b42;
	}
	/* ---------- Right: memory ---------- */
	#right {
		flex: 1;
		display: flex;
		flex-direction: column;
		min-width: 0;
	}
	#tabs {
		display: flex;
		flex-wrap: wrap;
		background: #2a2b31;
		border-bottom: 1px solid #3a3b42;
		flex-shrink: 0;
	}
	#tabs button {
		background: transparent;
		color: #aaa;
		border: none;
		border-right: 1px solid #3a3b42;
		padding: 7px 14px;
		cursor: pointer;
		font-family: inherit;
		font-size: 12px;
	}
	#tabs button.active { background: #1e1f24; color: #7ec699; font-weight: 700; }
	#tabs button:hover { color: #fff; }
	#memToolbar {
		padding: 6px 10px;
		display: flex;
		gap: 8px;
		align-items: center;
		border-bottom: 1px solid #3a3b42;
		flex-shrink: 0;
		flex-wrap: wrap;
	}
	#memToolbar input[type=text] {
		background: #16171a;
		border: 1px solid #3a3b42;
		color: #d4d4d4;
		font-family: inherit;
		padding: 3px 6px;
		width: 110px;
	}
	#hexView {
		flex: 1;
		overflow: auto;
		padding: 6px 10px;
		line-height: 1.5;
		white-space: pre;
	}
	.hexrow .off { color: #888; margin-right: 10px; }
	.hexrow .b { padding: 0 1px; margin-right: 4px; }
	.hexrow .b.chg { color: #ff6b6b; background: rgba(255,107,107,.18); border-radius: 2px; }
	.hexrow .b.new { color: #ffd93d; background: rgba(255,217,61,.18); border-radius: 2px; }
	.hexrow .b.hot { color: #ff6b6b; font-weight: 700; text-decoration: underline; }
	.hexrow .asc { color: #5f8a5f; margin-left: 12px; }
	#chgLog {
		max-height: 140px;
		overflow-y: auto;
		border-top: 1px solid #3a3b42;
		padding: 4px 10px;
		font-size: 12px;
		flex-shrink: 0;
	}
	#chgLog h3 { margin: 2px 0 4px; font-size: 12px; color: #7ec699; }
	#chgLog .row { color: #bbb; }
	#chgLog .row .a { color: #6fb3ff; }
	/* ---------- disasm ---------- */
	#disasmPanel {
		border-top: 2px solid #3a3b42;
		height: 42%;
		display: flex;
		flex-direction: column;
		flex-shrink: 0;
	}
	#disasmToolbar {
		padding: 6px 10px;
		display: flex;
		gap: 8px;
		align-items: center;
		border-bottom: 1px solid #3a3b42;
		flex-shrink: 0;
	}
	#disasmToolbar input[type=text] {
		background: #16171a;
		border: 1px solid #3a3b42;
		color: #d4d4d4;
		font-family: inherit;
		padding: 3px 6px;
		width: 110px;
	}
	#disasmToolbar .mode {
		padding: 1px 8px;
		border-radius: 3px;
		font-weight: 700;
		font-size: 12px;
	}
	.mode.thumb { background: #3a5a3a; color: #a0e8a0; }
	.mode.arm { background: #5a3a5a; color: #e8a0e8; }
	#disasmView {
		flex: 1;
		overflow: auto;
		padding: 4px 10px;
		line-height: 1.55;
		white-space: pre;
	}
	.drow .addr { color: #888; margin-right: 12px; }
	.drow .raw { color: #557; margin-right: 12px; }
	.drow .ins { color: #d4d4d4; }
	.drow .ins .mnc { color: #6fb3ff; }
	.drow.pc { background: rgba(126,198,153,.12); }
	.drow.pc .addr { color: #7ec699; font-weight: 700; }
	.drow.branch .ins { color: #ffd93d; }
	button {
		background: #2f3037;
		color: #ccc;
		border: 1px solid #3a3b42;
		padding: 4px 10px;
		cursor: pointer;
		font-family: inherit;
		font-size: 12px;
		border-radius: 3px;
	}
	button:hover { background: #3a3b42; color: #fff; }
	button.primary { background: #2e5e3e; border-color: #3e7e52; }
	button.primary:hover { background: #3e7e52; }
	label.chk { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: #aaa; }
	select {
		background: #16171a;
		color: #ccc;
		border: 1px solid #3a3b42;
		font-family: inherit;
		padding: 3px;
	}
	.hidden { display: none; }
	.warn { color: #ffd93d; font-size: 12px; }
	/* ---------- 联机模式 ---------- */
	.modeSwitch { margin-left: 16px; }
	.modeSwitch button { padding: 4px 14px; border: 1px solid #3a3b42; background: #23242a; color: #ccc; cursor: pointer; }
	.modeSwitch button.active { background: #3d6db5; color: #fff; }
	#onlinePanel { border: 1px solid #3a3b42; background: #1d1e24; padding: 8px 10px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
	#onlinePanel input[type=text] { width: 170px; }
	#onlinePanel select { max-width: 260px; }
	.recDot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #555; margin-right: 4px; vertical-align: middle; }
	.recDot.on { background: #ff4d4d; box-shadow: 0 0 6px #ff4d4d; }
	.onlineOnly { display: none; }
	body.online .onlineOnly { display: flex; }
	body.online .localOnly { display: none; }
	#onlineHelp { font-size: 12px; color: #8a8b92; width: 100%; }
</style>
</head>
<body>
<header>
	<h1>GBA Memory Viewer</h1>
	<span class="status" id="status">未加载 ROM</span>
	<span class="warn" id="fpshint"></span>
	
</header>

<div id="onlinePanel" class="hidden">
	<span>Server:</span><input type="text" id="srvUrl" value="http://localhost:8650">
	<button onclick="refreshRoms()">刷新 ROM 列表</button>
	<span style="margin-left:12px">
		<span id="audioStat" style="color:#8ab4ff" title="AudioContext 状态/队列">🔇 -</span>
		<span class="recDot" id="recDot"></span>
		<label class="chk"><input type="checkbox" id="recChk" onchange="toggleRecord(this.checked)"> 记录会话（AI 可回放）</label>
		<span id="recSteps" style="color:#7ec699"></span>
	</span>
	<div id="onlineHelp">操作按键：Z=A　X=B　Enter=START　Shift=SELECT　方向键　Q=L　E=R（首次按键后出声）</div>
</div>

<div id="main">
	<!-- ==================== Left: game screen ==================== -->
	<div id="left">
		<div id="screenWrap"><canvas id="screen" width="480" height="320"></canvas></div>
		<div id="gameControls">
			<select id="romList" title="ROM 列表（来自 serve 的 roms/ 目录，本地/联机两种模式通用）"><option>— 刷新中… —</option></select>
			<button class="primary" onclick="loadRomUnified()">加载 ROM</button>
			<label class="chk"><input type="checkbox" id="lockPcChk"> 跟随 PC 反汇编</label>
			<label class="chk"><input type="checkbox" id="autoRefreshChk" checked> 自动刷新内存</label>
			<label class="chk">刷新间隔
				<select id="refreshRate">
					<option value="250" selected>250ms</option>
					<option value="500">500ms</option>
					<option value="1000">1s</option>
					<option value="0">手动</option>
				</select>
			</label>
		</div>
	</div>

	<!-- ==================== Right: memory + disasm ==================== -->
	<div id="right">
		<div id="tabs"></div>
		<div id="memToolbar">
			<span>地址:</span>
			<input type="text" id="gotoAddr" placeholder="0x03000000">
			<button onclick="gotoAddress()">跳转</button>
			<button onclick="page(-1)">◀ 上一页</button>
			<button onclick="page(1)">下一页 ▶</button>
			<button onclick="takeSnapshot()" title="以当前内容为基线，之后的变化以红色高亮">📷 设为基线</button>
			<button onclick="showOnlyChanged()" title="跳到下一个有变化的页面">↓ 下一个变化页</button>
			<label class="chk"><input type="checkbox" id="autoBaseline" checked> 每次刷新自动重新基线</label>
		</div>
		<div id="hexView"></div>
		<div id="chgLog">
			<h3>最近内存变化 <span id="chgCount"></span></h3>
			<div id="chgRows"><div class="row">（尚无数据）</div></div>
		</div>

		<div id="disasmPanel">
			<div id="disasmToolbar">
				<span>反汇编:</span>
				<input type="text" id="disasmAddr" placeholder="PC 地址">
				<button onclick="disasmGoto()">跳转</button>
				<button onclick="disasmFollowPc()">跟随 PC</button>
				<span class="mode thumb" id="cpuMode">THUMB</span>
				<span id="pcLabel" style="color:#7ec699"></span>
			</div>
			<div id="disasmView"></div>
		</div>
	</div>
</div>

<!-- serve-only：本地模拟器脚本已移除，页面只做手柄+屏幕+内存监视 -->
<script src="js/audio.js"></script> <!-- 复用 gbajs2 原版音频消费器 -->


<script>
'use strict';

/* ================================================================
 * GBA memory regions
 * ================================================================ */
const REGIONS = [
	{ id: 'iwram', name: 'IWRAM (32K)',  base: 0x03000000, size: 0x8000  },
	{ id: 'ewram', name: 'EWRAM (256K)', base: 0x02000000, size: 0x40000 },
	{ id: 'io',    name: 'IO (1K)',      base: 0x04000000, size: 0x400   },
	{ id: 'pal',   name: 'Palette (1K)', base: 0x05000000, size: 0x400   },
	{ id: 'vram',  name: 'VRAM (96K)',   base: 0x06000000, size: 0x18000 },
	{ id: 'oam',   name: 'OAM (1K)',     base: 0x07000000, size: 0x400   },
	{ id: 'rom',   name: 'ROM (前128K)', base: 0x08000000, size: 0x20000 },
];
const ROW_BYTES = 16;
const VIEW_ROWS = 24;

let currentRegion = REGIONS[0];
let viewBase = 0x03000000;     // 当前 hex 窗口起始地址（16字节对齐）
let prevData = null;           // 上一帧窗口快照 (Uint8Array)
let baseline = null;           // 基线快照
let changeLog = [];            // [{addr, old, new, time}]
let refreshTimer = null;

function setStatus(text, warn) {
	const el = document.getElementById('status');
	el.textContent = text;
	el.style.color = warn ? '#ff6b6b' : '#999';
}

/* ================================================================
 * Tabs
 * ================================================================ */
function buildTabs() {
	const tabs = document.getElementById('tabs');
	REGIONS.forEach(r => {
		const b = document.createElement('button');
		b.textContent = r.name;
		b.dataset.id = r.id;
		b.onclick = () => selectRegion(r.id);
		tabs.appendChild(b);
	});
	tabs.children[0].classList.add('active');
}

function selectRegion(id) {
	currentRegion = REGIONS.find(r => r.id === id);
	viewBase = currentRegion.base;
	prevData = null;
	[...document.getElementById('tabs').children].forEach(b =>
		b.classList.toggle('active', b.dataset.id === id));
	document.getElementById('gotoAddr').value = '0x' + viewBase.toString(16).toUpperCase();
	refreshMemory();
}

/* ================================================================
 * Hex view + change tracking
 * ================================================================ */
function parseAddr(s) {
	if (!s) return NaN;
	s = s.trim().replace(/^0x/i, '');
	if (!/^[0-9a-f]+$/i.test(s)) return NaN;
	return parseInt(s, 16) >>> 0;
}

function gotoAddress() {
	const a = parseAddr(document.getElementById('gotoAddr').value);
	if (isNaN(a)) return;
	viewBase = align16(a);
	// 跨区域时自动切换 region 标签
	const r = REGIONS.find(r => a >= r.base && a < r.base + r.size);
	if (r && r.id !== currentRegion.id) {
		currentRegion = r;
		[...document.getElementById('tabs').children].forEach(b =>
			b.classList.toggle('active', b.dataset.id === r.id));
	}
	prevData = null;
	refreshMemory();
}

function page(dir) {
	const delta = dir * VIEW_ROWS * ROW_BYTES;
	let next = viewBase + delta;
	if (next < currentRegion.base) next = currentRegion.base;
	if (next > currentRegion.base + currentRegion.size - VIEW_ROWS * ROW_BYTES)
		next = currentRegion.base + currentRegion.size - VIEW_ROWS * ROW_BYTES;
	viewBase = align16(next);
	prevData = null;
	refreshMemory();
}

function align16(a) { return a & ~0xf; }

function takeSnapshot() {
	fetchServeMem(viewBase, VIEW_ROWS * ROW_BYTES).then(b => { baseline = b; }).catch(() => {});
}

/* 联机模式内存读取：走 serve /memread */
async function fetchServeMem(addr, len) {
	const r = await api('/memread?addr=0x' + (addr >>> 0).toString(16) + '&len=' + len);
	const d = await r.json();
	if (!d.ok) throw new Error(d.error || 'memread 失败');
	const out = new Uint8Array(len);
	for (let i = 0; i < len; i++) out[i] = parseInt(d.hex.substr(i * 2, 2), 16);
	return out;
}

async function showOnlyChanged() {
	// 在当前区域内扫描有变化的第一页（与基线对比），数据走 serve
	if (!baseline) return;
	const bytes = VIEW_ROWS * ROW_BYTES;
	for (let cand = align16(viewBase) + ROW_BYTES; cand < currentRegion.base + currentRegion.size - bytes; cand += ROW_BYTES) {
		try {
			const b = await fetchServeMem(cand, bytes);
			for (let i2 = 0; i2 < bytes; i2++) {
				if (b[i2] !== baseline[i2]) {
					viewBase = align16(cand);
					document.getElementById('gotoAddr').value = '0x' + viewBase.toString(16).toUpperCase();
					refreshMemory();
					return;
				}
			}
		} catch (e) { break; }
	}
	setStatus('本区域基线之后没有更多变化');
}

async function refreshMemory() {
	const hexView = document.getElementById('hexView');
	const bytes = VIEW_ROWS * ROW_BYTES;
	let cur;
	try { cur = await fetchServeMem(viewBase, bytes); }
	catch (e) { setOnlineStatus('内存读取失败: ' + e.message); return; }

	let html = '';
	let chgs = [];
	for (let row = 0; row < VIEW_ROWS; row++) {
		const rowAddr = viewBase + row * ROW_BYTES;
		let hex = '', asc = '';
		for (let c = 0; c < ROW_BYTES; c++) {
			const i = row * ROW_BYTES + c;
			let v = cur[i];
			let cls = 'b';
			if (v === undefined || v === null) {
				hex += '<span class="b">?? </span>';
				asc += ' ';
				continue;
			}
			// 与上一帧对比：变化标红
			if (prevData && prevData[i] !== v && prevData[i] >= 0) {
				cls += ' chg';
				if (changeLog.length < 500 && changeLog.every(e => e.addr !== rowAddr + c || e.newVal !== v)) {
					chgs.push({ addr: rowAddr + c, old: prevData[i], newVal: v });
				}
			}
			// 与基线对比：持续被改写标下划线
			if (baseline && baseline[i] !== v) cls += ' hot';
			hex += '<span class="' + cls + '">' + v.toString(16).toUpperCase().padStart(2, '0') + '</span>';
			asc += (v >= 0x20 && v < 0x7f) ? String.fromCharCode(v) : '.';
		}
		html += '<div class="hexrow"><span class="off">0x' + rowAddr.toString(16).toUpperCase().padStart(8, '0') +
			'</span>' + hex + '<span class="asc">' + asc + '</span></div>';
	}
	hexView.innerHTML = html;

	// 更新变化日志（合并同一地址的连续变化）
	if (chgs.length) {
		const now = new Date();
		const ts = now.toTimeString().slice(0, 8) + '.' + String(now.getMilliseconds()).padStart(3, '0');
		changeLog.unshift({ ts, items: chgs });
		if (changeLog.length > 60) changeLog.pop();
	}
	document.getElementById('chgCount').textContent = '(' + changeLog.length + ' 批)';
	const rows = changeLog.slice(0, 25).map(batch => {
		const shown = batch.items.slice(0, 6).map(c =>
			'<span class="a">0x' + c.addr.toString(16).toUpperCase() + '</span>:' +
			c.old.toString(16).toUpperCase() + '→' + c.newVal.toString(16).toUpperCase()).join('  ');
		return '<div class="row">[' + batch.ts + '] ' + shown +
			(batch.items.length > 6 ? '  +' + (batch.items.length - 6) + ' more' : '') + '</div>';
	}).join('');
	document.getElementById('chgRows').innerHTML = rows || '<div class="row">（尚无数据）</div>';

	// 自动基线：下一次刷新时以本帧为对照
	if (document.getElementById('autoBaseline').checked) {
		prevData = cur;
	}
}

/* ================================================================
 * Disassembly panel
 * ================================================================ */
async function refreshDisasm() {
	let mode, pc;
	try {
		const r = await api('/regs');
		const d = await r.json();
		if (!d.ok) throw new Error(d.error || 'regs 失败');
		mode = d.mode.toLowerCase();
		pc = parseInt(d.gprs.pc, 16) >>> 0;
	} catch (e) { return; }
	const modeEl = document.getElementById('cpuMode');
	modeEl.textContent = mode.toUpperCase();
	modeEl.className = 'mode ' + mode;

	// Thumb PC 读数为当前指令+4；ARM 为 +8
	const execAddr = (pc - (mode === 'thumb' ? 4 : 8)) >>> 0;
	document.getElementById('pcLabel').textContent =
		'PC=0x' + pc.toString(16).toUpperCase() + '  执行于 0x' + execAddr.toString(16).toUpperCase();

	let start;
	const follow = document.getElementById('lockPcChk').checked;
	if (follow) {
		start = align16(execAddr) & ~3;
		document.getElementById('disasmAddr').value = '0x' + start.toString(16).toUpperCase();
	} else {
		const typed = parseAddr(document.getElementById('disasmAddr').value);
		start = (isNaN(typed) ? (disasmBase || execAddr) : typed) & ~3;
	}
	disasmBase = start;

	const count = 40;
	let lines;
	try {
		const r = await api('/disasm?addr=0x' + (start >>> 0).toString(16) + '&n=' + count + '&mode=' + mode);
		const d = await r.json();
		if (!d.ok) throw new Error(d.error || 'disasm 失败');
		lines = d.lines.map(l => ({ address: parseInt(l.addr, 16), bytes: l.bytes, text: l.text }));
	} catch (e) { return; }
	let html = '';
	for (const ln of lines) {
		const isPc = ((ln.address >>> 0) === execAddr) || (mode === 'thumb' && ln.address === execAddr);
		const isBranch = /^b|bl /.test(ln.text);
		const mnc = ln.text.replace(/^([a-z][a-z0-9]*[a-z0-9]*)(\s)/, '<span class="mnc">$1</span>$2');
		html += '<div class="drow' + (isPc ? ' pc' : '') + (isBranch ? ' branch' : '') +
			'"><span class="addr">0x' + (ln.address >>> 0).toString(16).toUpperCase().padStart(8, '0') +
			'</span><span class="raw">' + ln.bytes + '</span><span class="ins">' + mnc + '</span></div>';
	}
	document.getElementById('disasmView').innerHTML = html;
}

let disasmBase = 0;

function disasmGoto() {
	const a = parseAddr(document.getElementById('disasmAddr').value);
	if (!isNaN(a)) {
		disasmBase = a & ~3;
		document.getElementById('lockPcChk').checked = false;
		refreshDisasm();
	}
}

function disasmFollowPc() {
	document.getElementById('lockPcChk').checked = true;
	refreshDisasm();
}

/* ================================================================
 * Refresh timer
 * ================================================================ */
function setupRefreshTimer() {
	if (refreshTimer) clearInterval(refreshTimer);
	const rate = parseInt(document.getElementById('refreshRate').value, 10);
	if (rate > 0) {
		let lastPanel = 0;
		refreshTimer = setInterval(function () {
			if (!document.getElementById('autoRefreshChk').checked) return;
			// 游戏运行时（单线程 serve 被 /play 占用）面板刷新软性降到 ≥1s，减少排队卡顿
			if (online.playing && rate < 1000 && Date.now() - lastPanel < 990) return;
			lastPanel = Date.now();
			refreshMemory();
			refreshDisasm();
		}, rate);
	}
}
document.getElementById('refreshRate').onchange = function () {
	setupRefreshTimer();
};

/* ================================================================
 * Init
 * ================================================================ */
buildTabs();
window.onload = function () {
	initOnline();
	setStatus('联机模式');
	document.getElementById('gotoAddr').value = '0x03000000';
};

/* ================================================================
 * 联机调试模式：模拟器在 serve（romctl.js serve）侧，页面只是手柄+屏幕。
 * 所有操作走 serve → 自动记录操作+截图 → AI 经 /session?op=steps 拉取。
 * ================================================================ */
let online = { active: true, base: '', held: new Set(), playing: false, rec: false }; // serve-only
const CID = 'tab' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); // 本标签客户端 ID
const ONLINE_KEYS = {
	KeyZ: 'A', KeyX: 'B', Enter: 'START', ShiftLeft: 'SELECT', ShiftRight: 'SELECT',
	ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', KeyQ: 'L', KeyE: 'R',
};

/* ---- 联机音频：复用 gbajs2 原版 GameBoyAdvanceAudio 消费器 ----
 * 原本地模式音乐正常 = 用的是 gbajs2 自带 audioProcess（resampleRatio 重采样、
 * outputPointer 欠载保护、masterEnable 门控）。这里构造一个纯音频引擎实例，
 * 把 serve /audio 拉到的样本按 writeSample 语义写入它的环形缓冲，播放路径与原版一致。 */
let audioEngine = null, audioCtx = null, audioStarted = false;
let audioRxKB = 0, audioProcCalls = 0;
function setupAudio() {
	try {
		audioEngine = new GameBoyAdvanceAudio();
		// [关键1] clear() 是真正的状态初始化器（samplePointer/outputPointer/通道全在内），
		// 构造器只建 AudioContext+ScriptProcessor。不调 clear = 指针 undefined（buf=NaN）
		// clear() 内部读 this.core.irq.FREQUENCY（真实 CPU 主频 16777216）——纯音频实例需补最小假 core
		audioEngine.core = { irq: { FREQUENCY: 16777216, pollNextEvent: function () {} } };
		audioEngine.clear();
		audioCtx = audioEngine.context;
		// 服务端环已放大到 2s（65536）；客户端环同步放大，避免 60 帧/1s 爆发覆盖 0.5s 默认环
		audioEngine.maxSamples = 4096 << 4;
		audioEngine.buffers = [new Float32Array(audioEngine.maxSamples), new Float32Array(audioEngine.maxSamples)];
		audioEngine.sampleMask = audioEngine.maxSamples - 1;
		audioEngine.masterEnable = true;
		audioEngine.masterVolume = 1.0;
		// [关键2] 原版把 jsAudio→destination 的连接藏在 writeEnable()（游戏写 0x84 时才连），
		// 纯音频实例没人调它 → audioProcess 永不触发（proc=0 静音）。这里手动连上
		audioEngine.jsAudio.connect(audioEngine.context.destination);
		// 读指针从写指针后方 0.25s 起步（留缓冲，不放陈旧历史数据）
		audioEngine.outputPointer = (audioEngine.samplePointer - 8192 + audioEngine.maxSamples) % audioEngine.maxSamples;
	} catch (e) {
		console.warn('音频引擎创建失败', e);
		const el0 = document.getElementById('audioStat');
		if (el0) el0.textContent = '❌ ' + (e && e.message || e);
		audioEngine = null; return;
	}
}
/* 把 /audio 收到的 float32 交错 L/R 样本按 writeSample 语义写入引擎环 */
function feedEngine(f32) {
	const eng = audioEngine;
	let n = f32.length / 2;
	if (n > eng.maxSamples - 64) {
		const drop = n - (eng.maxSamples - 64);
		eng.outputPointer = (eng.outputPointer + drop * eng.resampleRatio) % eng.maxSamples;
		n = eng.maxSamples - 64;
	}
	for (let i = 0; i < n; i++) {
		const p = eng.samplePointer;
		eng.buffers[0][p] = f32[i * 2];
		eng.buffers[1][p] = f32[i * 2 + 1];
		eng.samplePointer = (p + 1) & eng.sampleMask;
	}
}
async function audioPollLoop() {
	while (true) {
		if (audioStarted && audioEngine && !wsOpen()) { // WS 模式音频由服务端推送
			try {
				const r = await fetch(apiBase() + '/audio?cid=' + CID);
				if (r.ok) {
					const buf = await r.arrayBuffer();
					if (buf.byteLength >= 8) {
						audioRxKB += buf.byteLength / 1024;
						feedEngine(new Float32Array(buf));
					}
				}
			} catch (e) {}
		}
		await new Promise(res => setTimeout(res, 80));
	}
}
/* 浏览器自动播放策略：首次交互后才能出声；每次手势都重试 */
function unlockAudio() {
	if (!audioEngine) setupAudio();
	if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(function () {});
	audioStarted = true;
}
window.addEventListener('keydown', unlockAudio);
window.addEventListener('pointerdown', unlockAudio);

/* 指示器: 每 0.5s 显示引擎状态与缓冲积压 */
setInterval(function () {
	const el = document.getElementById('audioStat');
	if (!el) return;
	if (!audioEngine || !audioCtx) { el.textContent = '🔇 无ctx'; return; }
	const st = audioCtx.state === 'running' ? '🔊' : '🔇';
	const backlog = ((audioEngine.samplePointer - audioEngine.outputPointer + audioEngine.maxSamples) % audioEngine.maxSamples) / 32768;
	el.textContent = st + ' ' + audioCtx.state + ' buf=' + backlog.toFixed(2) + 's rx=' + audioRxKB.toFixed(0) + 'KB proc=' + audioProcCalls;
}, 500);

/* serve 启动时可能已通过状态恢复自动加载了 ROM——检测到就直接开画+出声 */
async function autoStartIfLoaded() {
	try {
		const r = await api('/status');
		const d = await r.json();
		if (!d.ok || !d.rom) { setOnlineStatus('联机模式：选择 ROM 后点「加载 ROM」（首次按键后出声）'); return; }
		serveRomName = d.rom.split(/[\/]/).pop();
		const sel = document.getElementById('romList');
		for (const o of sel.options) if (o.value === serveRomName) { sel.value = serveRomName; break; }
		online.playing = true;
		playLoop();
		unlockAudio();
		setOnlineStatus('联机运行: ' + serveRomName + '（serve 已在运行，自动接续；首次按键后出声）');
		refreshMemory();
		refreshDisasm();
	} catch (e) {
		setOnlineStatus('联机模式：选择 ROM 后点「加载 ROM」（首次按键后出声）');
	}
}

/* serve-only 初始化：页面由 serve 静态提供，自动连本源 */
async function initOnline() {
	document.body.classList.add('online');
	try {
		if (location.protocol.startsWith('http')) {
			online.base = location.origin;
			document.getElementById('srvUrl').value = location.origin;
		}
	} catch (e) {}
	online.base = online.base.replace(/localhost/gi, '127.0.0.1');
	await refreshRoms();      // 先填 ROM 下拉框
	syncServeRomName();
	setupRefreshTimer();
	setupAudio();
	wsConnect();
	audioPollLoop();
	autoStartIfLoaded();      // serve 已有 ROM → 自动开始推帧
}

/* 从 serve 同步它当前加载的 ROM 名，检测两边不一致 */
async function syncServeRomName() {
	try {
		const r = await api('/status');
		const d = await r.json();
		if (d.ok && d.rom) serveRomName = d.rom.split(/[\\/]/).pop();
	} catch (e) {}
	checkRomMismatch();
}

function checkRomMismatch() {
	// serve-only：无本地实例，不再有 ROM 不一致问题
}

function setOnlineStatus(t) { document.getElementById('status').textContent = t || '联机模式'; }

function apiBase() {
	if (online.base) return online.base;
	try { return document.getElementById('srvUrl').value.replace(/\/$/, '').replace(/localhost/gi, '127.0.0.1'); } catch (e) { return 'http://127.0.0.1:8650'; }
}

async function api(path) {
	const r = await fetch(apiBase() + path);
	if (!r.ok && r.status !== 500) throw new Error('HTTP ' + r.status);
	return r;
}

async function refreshRoms() {
	try {
		const r = await api('/roms');
		const d = await r.json();
		const sel = document.getElementById('romList');
		const keep = sel.value;
		sel.innerHTML = '';
		for (const f of d.roms) {
			const o = document.createElement('option');
			o.value = f; o.textContent = f;
			sel.appendChild(o);
		}
		if (keep && d.roms.includes(keep)) sel.value = keep;
	} catch (e) {
		if (online.active) setOnlineStatus('连不上 serve: ' + e.message + '（先启动 node romctl.js serve 8650）');
	}
}

/* 唯一的 ROM 选择入口：下拉列表在两种模式共用，
 * 本地模式 → 浏览器实例加载；联机模式 → serve 加载。不再有两套选择器。 */
let localRomName = null;   // 浏览器本地实例当前加载的 ROM
let serveRomName = null;   // serve 端当前加载的 ROM

async function loadRomUnified() {
	const f = document.getElementById('romList').value;
	if (!f || !f.endsWith('.gba')) { setOnlineStatus('先选择 ROM'); return; }
	try {
		const r = await api('/load?rom=' + encodeURIComponent('roms/' + f));
		const d = await r.json();
		if (!d.ok) throw new Error(d.error || 'load 失败');
		serveRomName = f;
		online.playing = true;
		playLoop();
		setOnlineStatus('联机运行: ' + f);
		refreshMemory(); // 立即刷右侧面板（不等 250ms 定时器）
		refreshDisasm();
	} catch (e) { setOnlineStatus('加载失败: ' + e.message); }
}

async function toggleRecord(on) {
	try {
		const r = await api('/session?op=' + (on ? 'start' : 'stop'));
		const d = await r.json();
		online.rec = on;
		document.getElementById('recDot').classList.toggle('on', on);
		if (on) setOnlineStatus('记录中 → tmp/session/');
		else setOnlineStatus('记录已停止，共 ' + (d.steps || 0) + ' 步');
		if (on) pollSteps();
	} catch (e) {
		online.rec = false;
		document.getElementById('recChk').checked = false;
		setOnlineStatus('记录开关失败: ' + e.message);
	}
}

async function pollSteps() {
	while (online.rec) {
		try {
			const r = await api('/session?op=status');
			const d = await r.json();
			document.getElementById('recSteps').textContent = d.on ? ('已记录 ' + d.seq + ' 步') : '';
			if (!d.on) break;
		} catch (e) { break; }
		await new Promise(res => setTimeout(res, 2000));
	}
}

/* ---- 键盘输入 → held mask → /pad ---- */
window.addEventListener('keydown', function (e) {
	if (!online.active) return;
	const tag = (document.activeElement && document.activeElement.tagName) || '';
	if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
	const k = ONLINE_KEYS[e.code];
	if (!k) return;
	e.preventDefault();
	if (!online.held.has(k)) {
		online.held.add(k);
		sendPad();
	}
});
window.addEventListener('keyup', function (e) {
	if (!online.active) return;
	const k = ONLINE_KEYS[e.code];
	if (!k) return;
	if (online.held.delete(k)) sendPad();
});

async function sendPad() {
	if (!online.active) return;
	if (wsOpen()) { wsSendObj({ t: 'pad', keys: [...online.held] }); return; } // WS 直达：<5ms 生效
	try { await api('/pad?keys=' + encodeURIComponent([...online.held].join(','))); } catch (e) {}
}
/* ---- WebSocket 通道（服务端推帧/推音频/即时按键）----
 * 二进制消息: [type,0,0,0]+payload（4 字节头保证 Float32 对齐）
 *   type1 = BMP 帧 → 画到屏幕；type2 = float32 交错音频 → feedEngine
 * 断线自动重连（2s），恢复后自动续播 */
let WS = null, wsRetryTimer = null, wsWanted = false;
function wsOpen() { return WS && WS.readyState === 1; }
function wsSendObj(o) { try { WS.send(JSON.stringify(o)); } catch (e) {} }
function wsConnect() {
	if (!online.base) return;
	wsWanted = true;
	try {
		WS = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
	} catch (e) { return; }
	WS.binaryType = 'arraybuffer';
	WS.onopen = function () {
		wsSendObj({ t: 'hello' });
		if (online.playing) wsSendObj({ t: 'play', on: 1 }); // 断线重连后续播
	};
	WS.onmessage = function (ev) {
		if (typeof ev.data === 'string') { /* JSON: 预留 */ return; }
		wsOnBinary(ev.data);
	};
	WS.onclose = function () {
		WS = null;
		if (wsWanted) { clearTimeout(wsRetryTimer); wsRetryTimer = setTimeout(wsConnect, 2000); }
	};
	WS.onerror = function () { try { WS.close(); } catch (e) {} };
}
function wsOnBinary(ab) {
	if (ab.byteLength < 4) return;
	const dv = new DataView(ab);
	const type = dv.getUint8(0);
	if (type === 1) {
		// BMP 帧 → 屏（复用 /play 的 Blob+Image 绘制路径）
		const cv = document.getElementById('screen');
		const ctx = cv.getContext('2d');
		ctx.imageSmoothingEnabled = false;
		const blob = new Blob([ab.slice(4)], { type: 'image/bmp' });
		const url = URL.createObjectURL(blob);
		const img = new Image();
		img.onload = function () { ctx.drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); };
		img.onerror = function () { URL.revokeObjectURL(url); };
		img.src = url;
	} else if (type === 2 && audioEngine) {
		feedEngine(new Float32Array(ab, 4)); // 服务端已按 0.25s+ 批量推，直接入环
	}
}
/* ---- 主循环：/play 推帧 + BMP 回传渲染 ---- */
async function playLoop() {
	if (!online.active || online.playing !== true) return;
	if (wsOpen()) { wsSendObj({ t: 'play', on: 1 }); return; } // WS 模式：服务端推帧+推音频，本循环不再拉取
	const cv = document.getElementById('screen');
	const ctx = cv.getContext('2d');
	ctx.imageSmoothingEnabled = false;
	let framesPerCall = 2;
	while (online.active && online.playing) {
		const t0 = performance.now();
		let r;
		try { r = await fetch(apiBase() + '/play?frames=' + framesPerCall + '&cid=' + CID); } catch (e) {
			setOnlineStatus('serve 断开: ' + e.message);
			online.playing = false;
			return;
		}
		if (!r.ok) {
			let msg = 'HTTP ' + r.status;
			try { msg = (await r.json()).error || msg; } catch (_) {}
			setOnlineStatus('play 失败: ' + msg);
			online.playing = false;
			if (wsOpen()) wsSendObj({ t: 'play', on: 0 });
			return;
		}
		const buf = await r.arrayBuffer();
		const blob = new Blob([buf], { type: 'image/bmp' });
		const url = URL.createObjectURL(blob);
		await new Promise((res) => {
			const img = new Image();
			img.onload = function () { ctx.drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(); };
			img.onerror = function () { URL.revokeObjectURL(url); res(); };
			img.src = url;
		});
		// 实时节流：模拟帧 × 16.7ms = 真实游戏速度。原版本地模式 = 60fps 实时跑，
		// 音频产出=消费速率一致；不节流时本机 20 倍速推帧会淹没音频环（音乐变噪音/静音）
		const wall = performance.now() - t0;
		const budget = framesPerCall * 16.7;
		if (wall < budget) await new Promise(res => setTimeout(res, budget - wall));
		const rtt = performance.now() - t0;
		const perFrame = Math.max(rtt / framesPerCall, 16.7);
		framesPerCall = Math.max(8, Math.min(30, Math.round(400 / perFrame))); // 目标 ~400ms/次：大批次减少请求开销（否则 60fps×小批次会把单线程 serve 的请求处理开销打满=页面卡顿）
	}
}
</script>
